<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador Pong - ESP32</title>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; flex-direction: column; }
        canvas { background: #000; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <h2>Simulador da Tela do ESP32</h2>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Avisa ao servidor que este cliente é um simulador (não ocupa vaga de player)
        const socket = io({
            query: {
                type: 'simulator'
            }
        });

        const paddleW = 10, paddleH = 80;
        let p1_y = 160, p2_y = 160;
        let ball = { x: 300, y: 200, dx: 4, dy: 4, size: 8 };
        let score = { p1: 0, p2: 0 };

        // Definindo a sensibilidade do controle
        const maxTilt = 20; // Antes era 45. Quanto menor, menos você precisa inclinar.

        socket.on('update_simulator', (data) => {
            // 1. Pega o valor recebido e inverte o sinal (multiplicando por -1)
            // Se o movimento ainda ficar contrário ao que você deseja, remova o sinal de menos.
            let rawBeta = -(data.beta || 0); 

            // 2. Limita o valor entre -maxTilt e +maxTilt (ex: -20 e +20)
            let beta = Math.max(-maxTilt, Math.min(maxTilt, rawBeta));
            
            // 3. Mapeia a angulação para a altura do canvas
            // Transforma o range de [-20 a 20] para um valor entre [0 e (canvas.height - paddleH)]
            let mappedY = ((beta + maxTilt) / (maxTilt * 2)) * (canvas.height - paddleH);
            
            if (data.player === 'Player 1') p1_y = mappedY;
            if (data.player === 'Player 2') p2_y = mappedY;
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha Raquetes e Centro
            ctx.fillStyle = '#fff';
            ctx.fillRect(20, p1_y, paddleW, paddleH);
            ctx.fillRect(canvas.width - 30, p2_y, paddleW, paddleH);

            ctx.setLineDash([10, 15]);
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
            ctx.strokeStyle = '#fff'; ctx.stroke();

            // Movimento da Bolinha
            ball.x += ball.dx; ball.y += ball.dy;
            if (ball.y <= 0 || ball.y >= canvas.height) ball.dy *= -1;

            // Colisões
            if (ball.x <= 30 && ball.y > p1_y && ball.y < p1_y + paddleH) { ball.dx *= -1; ball.x = 30; }
            if (ball.x >= canvas.width - 30 - ball.size && ball.y > p2_y && ball.y < p2_y + paddleH) { ball.dx *= -1; ball.x = canvas.width - 30 - ball.size; }

            // Pontuação
            if (ball.x < 0) { score.p2++; resetBall(); }
            if (ball.x > canvas.width) { score.p1++; resetBall(); }

            // Placar e Bolinha
            ctx.font = '30px Arial';
            ctx.fillText(score.p1, canvas.width/4, 50); ctx.fillText(score.p2, 3*canvas.width/4, 50);
            ctx.fillRect(ball.x, ball.y, ball.size, ball.size);

            requestAnimationFrame(gameLoop);
        }

        function resetBall() { ball.x = canvas.width/2; ball.y = canvas.height/2; ball.dx *= -1; }
        gameLoop();
    </script>
</body>
</html>
