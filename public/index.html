<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Pong</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111; color: #fff; margin: 0; } 
        button { padding: 15px 30px; font-size: 18px; background: #28a745; color: #fff; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1 id="role">Conectando...</h1>
    <button id="btn">Ativar Sensores</button>
    <p id="status"></p>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Avisa ao servidor que este é um controle
        const socket = io({
            query: {
                type: 'controller'
            }
        });

        socket.on('role', r => document.getElementById('role').innerText = r);
        
        document.getElementById('btn').onclick = () => {
            if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => res === 'granted' && start());
            } else { 
                start(); 
            }
        };

        function start() {
            document.getElementById('btn').style.display = 'none';
            window.addEventListener('deviceorientation', e => {
                document.getElementById('status').innerText = `Beta: ${e.beta?.toFixed(1)}°`;
                socket.emit('move', { beta: e.beta, gamma: e.gamma });
            });
        }
    </script>
</body>
</html>
